services:
  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doddle-os-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
      # Server-side LangGraph base URL — the agents backend container on the
      # shared doddle-os-network (created by the doddle-os-agents compose
      # stack, which names it `doddle-os-network`).
      - LANGGRAPH_API_URL=http://langgraph-api:8000
    env_file:
      - .env
    networks:
      - app-network
      - doddle-os-agents
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  app-network:
    driver: bridge
  doddle-os-agents:
    # The agents backend stack's bridge network (fixed name declared in the
    # doddle-os-agents docker-compose.yml). Bring the backend stack up first.
    external: true
    name: doddle-os-network
